<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Setup Profile - NoFap</title>
    <link rel="icon" type="image/png" href="resources/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050510;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f0ff;
            --accent-blue: #0066ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100dvh; /* Dynamic viewport handles mobile browser bars perfectly */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-y: auto;
            position: relative;
        }

        /* Loading Screen */
        .glass-loader {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 16, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .glass-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .loader-spinner-dual {
            width: 60px; height: 60px;
            border: 3px solid transparent;
            border-top-color: var(--accent-cyan);
            border-bottom-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin-bottom: 25px;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }
        .loader-spinner-dual::before {
            content: "";
            position: absolute;
            inset: 8px;
            border: 2px solid transparent;
            border-left-color: rgba(255,255,255,0.6);
            border-right-color: rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: spin-reverse 1.5s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes spin-reverse { to { transform: rotate(-360deg); } }

        /* Orbs */
        .orb { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.4; z-index: -1; animation: float 15s infinite alternate ease-in-out; }
        .orb-1 { width: 40vw; height: 40vw; background: var(--accent-cyan); top: -10%; left: -10%; }
        .orb-2 { width: 35vw; height: 35vw; background: #8a2be2; bottom: -10%; right: -10%; }
        @keyframes float { to { transform: translate(5vw, 5vh) scale(1.1); } }

        /* Centered Glass Card */
        .onboarding-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            margin: auto; /* Forces flexbox to respect top/bottom bounds on scroll */
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
        }
        
        .onboarding-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 240, 255, 0.1);
            border-color: rgba(0, 240, 255, 0.3);
        }

        .onboarding-card h2 { font-size: 1.8rem; margin-bottom: 8px; letter-spacing: -0.5px; }
        .onboarding-card p { color: var(--text-muted); margin-bottom: 28px; font-size: 0.95rem; }

        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
        
        input, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }
        input:focus, select:focus { 
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
            background: rgba(0, 0, 0, 0.5);
        }
        
        select option { background: #0f172a; color: white; }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-submit:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 20px rgba(0, 240, 255, 0.25);
        }
        .btn-submit:active { transform: translateY(1px); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        @media (max-width: 480px) {
            .onboarding-card { padding: 32px 24px; }
            .onboarding-card h2 { font-size: 1.6rem; }
            input, select, .btn-submit { padding: 12px 16px; }
        }
    </style>
</head>
<body>

    <!-- Liquid Glass Loader -->
    <div id="global-loader" class="glass-loader">
        <div class="loader-spinner-dual"></div>
        <h2 style="font-size: 0.9rem; font-weight: 700; letter-spacing: 4px; color: var(--text-muted); text-transform: uppercase;">Loading...</h2>
    </div>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="onboarding-card">
        <h2>Forge Your Identity</h2>
        <p>Set up your profile to enter the dashboard.</p>

        <form id="profileForm">
            <div class="input-group">
                <label>Nickname (Visible to friends)</label>
                <input type="text" id="nickname" required placeholder="e.g. ShadowMonk" maxlength="20">
            </div>
            
            <div class="input-group">
                <label>Date of Birth</label>
                <input type="date" id="dob" required>
            </div>
            
            <div class="input-group">
                <label>Gender</label>
                <select id="gender" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Enter the Arena</button>
        </form>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDT_eCcjjwc9k9dBjFUIOLcW3kJuWWzjq8",
            authDomain: "no-fap-addiction-remover.firebaseapp.com",
            projectId: "no-fap-addiction-remover",
            storageBucket: "no-fap-addiction-remover.firebasestorage.app",
            messagingSenderId: "534202646830",
            appId: "1:534202646830:web:04c0098a3ed15ed1d4fabf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists() && userDoc.data().nickname) {
                        // User already exists, bounce them to dashboard
                        window.location.href = "dashboard.html";
                        return;
                    }
                } catch (error) {
                    console.error("Error checking profile:", error);
                }

                // If they are a new user, reveal the form
                setTimeout(() => {
                    document.getElementById('global-loader').classList.add('hidden');
                }, 400);
            } else {
                window.location.href = "index.html";
            }
        });

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = "Forging profile...";

            const nickname = document.getElementById('nickname').value.trim();
            const dob = document.getElementById('dob').value;
            const gender = document.getElementById('gender').value;

            try {
                await setDoc(doc(db, "users", currentUser.uid), {
                    nickname: nickname,
                    dob: dob,
                    gender: gender,
                    email: currentUser.email,
                    currentStreak: 0,
                    highestStreak: 0,
                    createdAt: new Date().toISOString()
                }, { merge: true });

                window.location.href = "dashboard.html";
            } catch (error) {
                console.error("Error saving profile:", error);
                alert("Failed to save profile. Please try again.");
                btn.disabled = false;
                btn.textContent = "Enter the Arena";
            }
        });
    </script>
</body>
</html>
