<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Profile - NoFap</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050510;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f0ff;
            --accent-blue: #0066ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.4; z-index: -1; animation: float 15s infinite alternate ease-in-out; }
        .orb-1 { width: 40vw; height: 40vw; background: var(--accent-cyan); top: -20%; left: -10%; }
        .btn-submit:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 20px rgba(0, 240, 255, 0.3);
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Full Screen Liquid Glass Loader */
        .glass-loader {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 16, 0.8);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }
        .glass-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        
        .loader-spinner-large {
            width: 60px; height: 60px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top-color: var(--accent-cyan);
            border-bottom-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin-bottom: 25px;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }
        .loader-spinner-large::before {
            content: "";
            position: absolute;
            inset: 8px;
            border: 2px solid transparent;
            border-left-color: var(--text-main);
            border-right-color: var(--text-main);
            border-radius: 50%;
            animation: spin-reverse 1.5s linear infinite;
            opacity: 0.5;
        }
        @keyframes spin-reverse { to { transform: rotate(-360deg); } }
        
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Card Hover Animation */
        .onboarding-card {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease;
        }
        .onboarding-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 240, 255, 0.15);
            border-color: rgba(0, 240, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- Liquid Glass Overlay Loader -->
    <div id="global-loader" class="glass-loader">
        <div class="orb orb-1" style="width: 30vw; height: 30vw; animation-duration: 4s;"></div>
        <div class="loader-spinner-large"></div>
        <h2 style="font-size: 1.1rem; font-weight: 600; letter-spacing: 4px; color: var(--text-muted); text-transform: uppercase;">Loading...</h2>
    </div>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="onboarding-card">
        <h2>Forge Your Identity</h2>
        <p>Set up your profile to enter the dashboard.</p>

        <form id="profileForm">
            <div class="input-group">
                <label>Nickname (Visible to friends)</label>
                <input type="text" id="nickname" required placeholder="e.g. ShadowMonk" maxlength="20">
            </div>
            
            <div class="input-group">
                <label>Date of Birth</label>
                <input type="date" id="dob" required>
            </div>
            
            <div class="input-group">
                <label>Gender</label>
                <select id="gender" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Enter the Arena</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDT_eCcjjwc9k9dBjFUIOLcW3kJuWWzjq8",
            authDomain: "no-fap-addiction-remover.firebaseapp.com",
            projectId: "no-fap-addiction-remover",
            storageBucket: "no-fap-addiction-remover.firebasestorage.app",
            messagingSenderId: "534202646830",
            appId: "1:534202646830:web:04c0098a3ed15ed1d4fabf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        // Ensure user is logged in before they can submit the form
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                // Reveal the form smoothly
                setTimeout(() => {
                    document.getElementById('global-loader').classList.add('hidden');
                }, 600);
            } else {
                // If they land here without logging in, kick them to homepage
                window.location.href = "index.html";
            }
        });

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = "Forging profile...";

            const nickname = document.getElementById('nickname').value.trim();
            const dob = document.getElementById('dob').value;
            const gender = document.getElementById('gender').value;

            try {
                // Save to Firestore. Default start streak is 0.
                await setDoc(doc(db, "users", currentUser.uid), {
                    nickname: nickname,
                    dob: dob,
                    gender: gender,
                    email: currentUser.email,
                    currentStreak: 0,
                    highestStreak: 0,
                    createdAt: new Date().toISOString()
                }, { merge: true }); // Merge ensures we don't overwrite if data exists

                window.location.href = "dashboard.html";
            } catch (error) {
                console.error("Error saving profile:", error);
                alert("Failed to save profile. Please try again.");
                btn.disabled = false;
                btn.textContent = "Enter the Arena";
            }
        });
    </script>
</body>
</html>
