<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6b8"/><stop offset=".35" stop-color="#ffd23f"/><stop offset=".7" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/></linearGradient>
<linearGradient id="goldD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
<linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b45309" stop-opacity="0"/><stop offset="1" stop-color="#b45309" stop-opacity=".45"/></linearGradient>
<radialGradient id="pearl" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fff1c2"/><stop offset="1" stop-color="#f3c45a"/></radialGradient>
<radialGradient id="sap" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#d9efff"/><stop offset=".45" stop-color="#4a94ff"/><stop offset="1" stop-color="#1e40af"/></radialGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#ffc83d" stop-opacity=".5"/><stop offset="1" stop-color="#ffc83d" stop-opacity="0"/></radialGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><path d="M34 178 L22 90 Q33 120 42 130 Q51 118 61 64 Q70 112 81 124 Q92 112 100 44 Q108 112 119 124 Q130 112 139 64 Q149 118 158 130 Q167 120 178 90 L166 178 Z"/><rect x="28" y="170" width="144" height="40" rx="14"/></clipPath>
</defs>
<style>
.halo{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 2.6s ease-in-out infinite}
.crown{animation:float 2.6s ease-in-out infinite}
.sw{animation:sweep 3.2s ease-in-out infinite}
.bolt{transform-box:fill-box;transform-origin:50% 50%;animation:bp 1.6s ease-in-out infinite}
.sp{transform-box:fill-box;transform-origin:50% 50%;animation:tw 2.6s ease-in-out infinite;opacity:0}
.sp2{animation-delay:.9s} .sp3{animation-delay:1.7s}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sweep{0%{transform:translateX(-80px) skewX(-20deg)}60%,100%{transform:translateX(260px) skewX(-20deg)}}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
</style>
<ellipse class="halo" cx="100" cy="145" rx="98" ry="95" fill="url(#halo)"/>
<g transform="translate(0 14)"><g class="crown">
<path d="M34 178 L22 90 Q33 120 42 130 Q51 118 61 64 Q70 112 81 124 Q92 112 100 44 Q108 112 119 124 Q130 112 139 64 Q149 118 158 130 Q167 120 178 90 L166 178 Z" fill="#a85a06" stroke="#a85a06" stroke-width="14" stroke-linejoin="round"/>
<rect x="28" y="170" width="144" height="40" rx="14" fill="#a85a06" stroke="#a85a06" stroke-width="6"/>
<path d="M34 178 L22 90 Q33 120 42 130 Q51 118 61 64 Q70 112 81 124 Q92 112 100 44 Q108 112 119 124 Q130 112 139 64 Q149 118 158 130 Q167 120 178 90 L166 178 Z" fill="url(#gold)" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>
<!-- facet shading: darker right half of each peak -->
<g clip-path="url(#clip)">
<path d="M61 64 Q70 112 81 124 L72 178 L61 178Z M100 44 Q108 112 119 124 L110 178 L100 178Z M139 64 Q149 118 158 130 L150 178 L139 178Z M22 90 Q33 120 42 130 L36 178 L22 178Z" fill="#d97706" opacity=".35"/>
<path d="M61 64 Q52 118 42 130 L48 178 L61 178Z M100 44 Q92 112 81 124 L90 178 L100 178Z M139 64 Q130 112 119 124 L128 178 L139 178Z" fill="#fff" opacity=".28"/>
<rect x="20" y="130" width="160" height="50" fill="url(#fade)"/>
<rect class="sw" x="0" y="30" width="44" height="190" fill="url(#sweep)"/>
</g>
<!-- band -->
<rect x="28" y="170" width="144" height="40" rx="14" fill="url(#band)"/>
<rect x="36" y="174" width="128" height="7" rx="3.5" fill="#fff" opacity=".45"/>
<rect x="28" y="200" width="144" height="10" rx="5" fill="#b45309" opacity=".25"/>
<!-- band gems -->
<g fill="url(#sap)" stroke="#a85a06" stroke-width="2">
<path d="M55 190 l8 -9 8 9 -8 9z"/><path d="M129 190 l8 -9 8 9 -8 9z"/></g>
<circle cx="100" cy="190" r="19" fill="#a85a06"/><circle cx="100" cy="190" r="15.5" fill="url(#sap)"/>
<g class="bolt"><path transform="translate(93 181) scale(.083)" d="M122 10 L44 134 L98 134 L80 230 L158 96 L108 96 L140 10 Z" fill="#fff" stroke="#fff" stroke-width="14" stroke-linejoin="round"/></g>
<ellipse cx="94" cy="183" rx="5" ry="2.6" fill="#fff" opacity=".7" transform="rotate(-35 94 183)"/>
<!-- tip jewels -->
<circle cx="22" cy="86" r="10" fill="#a85a06"/><circle cx="22" cy="86" r="8" fill="url(#pearl)"/>
<circle cx="61" cy="60" r="10" fill="#a85a06"/><circle cx="61" cy="60" r="8" fill="url(#pearl)"/>
<circle cx="139" cy="60" r="10" fill="#a85a06"/><circle cx="139" cy="60" r="8" fill="url(#pearl)"/>
<circle cx="178" cy="86" r="10" fill="#a85a06"/><circle cx="178" cy="86" r="8" fill="url(#pearl)"/>
<circle cx="100" cy="40" r="13" fill="#a85a06"/><circle cx="100" cy="40" r="10.5" fill="url(#sap)"/>
<ellipse cx="96.5" cy="36" rx="4" ry="2.4" fill="#fff" opacity=".8" transform="rotate(-35 96.5 36)"/>
<g fill="#fff" opacity=".85"><ellipse cx="19" cy="83" rx="2.6" ry="1.6" transform="rotate(-35 19 83)"/><ellipse cx="58" cy="57" rx="2.6" ry="1.6" transform="rotate(-35 58 57)"/><ellipse cx="136" cy="57" rx="2.6" ry="1.6" transform="rotate(-35 136 57)"/><ellipse cx="175" cy="83" rx="2.6" ry="1.6" transform="rotate(-35 175 83)"/></g>
</g></g>
<g transform="translate(170 38) scale(1)"><path class="sp " d="M0 -12 L3.5 -3.5 L12 0 L3.5 3.5 L0 12 L-3.5 3.5 L-12 0 L-3.5 -3.5Z" fill="#fff"/></g>
<g transform="translate(26 62) scale(0.75)"><path class="sp sp2" d="M0 -12 L3.5 -3.5 L12 0 L3.5 3.5 L0 12 L-3.5 3.5 L-12 0 L-3.5 -3.5Z" fill="#fff1c2"/></g>
<g transform="translate(168 214) scale(0.65)"><path class="sp sp3" d="M0 -12 L3.5 -3.5 L12 0 L3.5 3.5 L0 12 L-3.5 3.5 L-12 0 L-3.5 -3.5Z" fill="#bfe0ff"/></g>
</svg>