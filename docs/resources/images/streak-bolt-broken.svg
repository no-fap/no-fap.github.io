<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="fill" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#ffd6d6"/><stop offset=".45" stop-color="#ff6b6b"/><stop offset="1" stop-color="#c81e3a"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#ff3b4e" stop-opacity=".4"/><stop offset="1" stop-color="#ff3b4e" stop-opacity="0"/></radialGradient>
<clipPath id="ct"><path d="M0 0H200V106L170 106L125 126L95 112L70 122L30 108L0 108Z"/></clipPath>
<clipPath id="cb"><path d="M0 108L30 108L70 122L95 112L125 126L170 106L200 106V250H0Z"/></clipPath>
<clipPath id="shape"><path d="M122 10 L44 134 L98 134 L80 230 L158 96 L108 96 L140 10 Z"/></clipPath>
</defs>
<style>
.halo{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 3s ease-in-out infinite}
.top,.bot{transform-origin:100px 115px}
.top{animation:wt 3s ease-in-out infinite}
.bot{animation:wb 3s ease-in-out infinite}
.sh{animation:fall 2.4s ease-in infinite;opacity:0}
.sh2{animation-delay:.8s} .sh3{animation-delay:1.6s}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.9}}
@keyframes wt{0%,100%{transform:translate(-4px,-6px) rotate(-4deg)}50%{transform:translate(-5px,-8px) rotate(-5.5deg)}}
@keyframes wb{0%,100%{transform:translate(5px,8px) rotate(5deg)}50%{transform:translate(6px,10px) rotate(6.5deg)}}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(55px) rotate(120deg);opacity:0}}
</style>
<ellipse class="halo" cx="100" cy="125" rx="85" ry="100" fill="url(#halo)"/>
<g class="bot"><g clip-path="url(#cb)">
<path d="M122 10 L44 134 L98 134 L80 230 L158 96 L108 96 L140 10 Z" fill="url(#fill)" stroke="url(#fill)" stroke-width="16" stroke-linejoin="round" opacity=".92"/>
<g clip-path="url(#shape)"><rect x="30" y="0" width="140" height="250" fill="url(#shine)" opacity=".5"/></g>
</g></g>
<g class="top"><g clip-path="url(#ct)">
<path d="M122 10 L44 134 L98 134 L80 230 L158 96 L108 96 L140 10 Z" fill="url(#fill)" stroke="url(#fill)" stroke-width="16" stroke-linejoin="round"/>
<g clip-path="url(#shape)"><rect x="30" y="0" width="140" height="250" fill="url(#shine)"/></g>
</g></g>
<polygon class="sh" points="78,124 86,124 82,134" fill="#ff6b6b"/>
<polygon class="sh sh2" points="112,120 119,122 113,130" fill="#ff8a8a"/>
<polygon class="sh sh3" points="136,114 142,112 140,121" fill="#e11d48"/>
</svg>