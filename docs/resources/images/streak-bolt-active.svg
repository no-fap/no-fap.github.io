<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="fill" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#d4e3ff"/><stop offset="1" stop-color="#7aa2ff"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#5b8cff" stop-opacity=".6"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
<clipPath id="clip"><path d="M122 10 L44 134 L98 134 L80 230 L158 96 L108 96 L140 10 Z"/></clipPath>
</defs>
<style>
.halo{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 2.2s ease-in-out infinite}
.bolt{transform-box:fill-box;transform-origin:50% 50%;animation:float 2.2s ease-in-out infinite}
.sp{transform-box:fill-box;transform-origin:50% 50%;animation:tw 2.2s ease-in-out infinite;opacity:0}
.sp2{animation-delay:1.1s}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.18);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.03)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
</style>
<ellipse class="halo" cx="100" cy="125" rx="90" ry="105" fill="url(#halo)"/>
<g class="bolt">
<path d="M122 10 L44 134 L98 134 L80 230 L158 96 L108 96 L140 10 Z" fill="#5b8cff" stroke="#5b8cff" stroke-width="16" stroke-linejoin="round" opacity=".7" filter="url(#blur)"/>
<path d="M122 10 L44 134 L98 134 L80 230 L158 96 L108 96 L140 10 Z" fill="url(#fill)" stroke="url(#fill)" stroke-width="16" stroke-linejoin="round"/>
<g clip-path="url(#clip)"><rect x="30" y="0" width="140" height="250" fill="url(#shine)"/></g>
</g>
<path class="sp" d="M165 40 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4z" fill="#fff"/>
<path class="sp sp2" d="M30 190 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" fill="#cfe0ff"/>
</svg>