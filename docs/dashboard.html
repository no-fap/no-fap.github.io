<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - NoFap</title>
  <link rel="icon" type="image/png" href="resources/images/logo.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-base: #03050a;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --glass-bg: rgba(255, 255, 255, 0.02);
      --glass-border: rgba(255, 255, 255, 0.05);
      --glass-hover: rgba(255, 255, 255, 0.06);
      
      --cyan: #38bdf8;
      --blue: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
      --nav-bg: rgba(3, 5, 10, 0.7);
    }

    body.light-mode {
      --bg-base: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #475569;
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-hover: rgba(255, 255, 255, 0.9);
      
      --cyan: #0284c7;
      --blue: #2563eb;
      --nav-bg: rgba(248, 250, 252, 0.8);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-base); color: var(--text-main);
      min-height: 100vh; display: flex; flex-direction: column;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* Navbar */
    header {
      background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border); padding: 16px 24px;
    }
    .nav-container { display: flex; align-items: center; justify-content: space-between; max-width: 900px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-main); }
    .brand img { width: 32px; height: 32px; border-radius: 8px; }
    .brand span { font-weight: 700; font-size: 1.1rem; }
    
    .nav-controls { display: flex; align-items: center; gap: 16px; }
    .theme-toggle {
      background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main);
      width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .sun-icon { display: none; }
    body.light-mode .sun-icon { display: block; }
    body.light-mode .moon-icon { display: none; }
    
    .logout-btn {
      background: transparent; border: 1px solid var(--glass-border); color: var(--text-main);
      padding: 8px 16px; border-radius: 99px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }

    /* Main Dashboard Layout */
    main { flex: 1; padding: 60px 24px; display: flex; flex-direction: column; align-items: center; }
    .dashboard-wrapper { max-width: 750px; width: 100%; }

    /* The Real UI Card */
    .dashboard-card {
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: 24px; padding: 32px; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    
    .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--glass-border); padding-bottom: 20px; }
    .user-info-box { display: flex; align-items: center; gap: 16px; }
    .avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--cyan), var(--blue)); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; color: #fff; }
    .user-details h3 { font-size: 1.2rem; color: var(--text-main); }
    .user-details p { font-size: 0.9rem; color: var(--cyan); font-weight: 600; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    .stat-box { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 24px; border-radius: 16px; }
    .stat-box span { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
    .stat-box h2 { font-size: 2.8rem; margin-top: 8px; font-weight: 800; color: var(--text-main); line-height: 1; }
    .stat-box .unit { font-size: 1rem; color: var(--text-muted); font-weight: 500; }

    /* Actions */
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .btn {
      padding: 16px; border-radius: 12px; font-weight: 700; font-size: 1rem;
      border: none; cursor: pointer; transition: transform 0.2s; color: #fff;
    }
    .btn:active { transform: scale(0.98); }
    .btn-clean { background: var(--green); }
    .btn-relapse { background: var(--red); }
    
    /* Loading Overlay */
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-base); display: flex; align-items: center; justify-content: center;
      z-index: 1000; font-weight: 600; transition: opacity 0.3s;
    }

    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: 1fr; }
      .actions { grid-template-columns: 1fr; }
      .dashboard-card { padding: 24px; }
    }
  </style>
</head>
<body>

  <div id="loading">Loading Dashboard...</div>

  <header>
    <div class="nav-container">
      <a href="index.html" class="brand">
        <img src="resources/images/logo.png" alt="Logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjMzhiZGY4IiByeD0iMTAiLz48L3N2Zz4='"/>
        <span>NoFap</span>
      </a>
      <div class="nav-controls">
        <button id="theme-toggle" class="theme-toggle">
          <svg class="moon-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          <svg class="sun-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </button>
        <button id="logout-btn" class="logout-btn">Log Out</button>
      </div>
    </div>
  </header>

  <main>
    <div class="dashboard-wrapper">
      <div class="dashboard-card">
        
        <div class="user-header">
          <div class="user-info-box">
            <div id="user-avatar" class="avatar">?</div>
            <div class="user-details">
              <h3 id="user-name">Loading Profile...</h3>
              <p id="user-rank">Rank: Calculating...</p>
            </div>
          </div>
        </div>
        
        <div class="stats-grid">
          <div class="stat-box">
            <span>Current Streak</span>
            <h2><span id="streak-val">0</span> <span class="unit">Days</span></h2>
          </div>
          <div class="stat-box">
            <span>Next Milestone</span>
            <h2><span id="milestone-name">-</span> <span class="unit" id="milestone-days"></span></h2>
          </div>
        </div>

        <div class="actions">
          <button id="btn-clean" class="btn btn-clean">Log Clean Day</button>
          <button id="btn-relapse" class="btn btn-relapse">I Relapsed</button>
        </div>
        
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    // Theme Setup
    const themeBtn = document.getElementById('theme-toggle');
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    });

    // Firebase Init
    const firebaseConfig = {
      apiKey: "AIzaSyDT_eCcjjwc9k9dBjFUIOLcW3kJuWWzjq8",
      authDomain: "no-fap-addiction-remover.firebaseapp.com",
      projectId: "no-fap-addiction-remover",
      storageBucket: "no-fap-addiction-remover.firebasestorage.app",
      messagingSenderId: "534202646830",
      appId: "1:534202646830:web:04c0098a3ed15ed1d4fabf"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // DOM Elements
    const loadingUI = document.getElementById('loading');
    const uName = document.getElementById('user-name');
    const uAvatar = document.getElementById('user-avatar');
    const uRank = document.getElementById('user-rank');
    const streakVal = document.getElementById('streak-val');
    const msName = document.getElementById('milestone-name');
    const msDays = document.getElementById('milestone-days');
    
    let currentUserDoc = null;
    let currentUid = null;

    // Rank Logic
    const ranks = [
      { max: 3, name: "Novice", level: 1 },
      { max: 7, name: "Apprentice", level: 2 },
      { max: 21, name: "Warrior", level: 3 },
      { max: 89, name: "Monk", level: 4 },
      { max: 9999, name: "Ascetic", level: 5 }
    ];

    function calculateRank(days) {
      for (let i = 0; i < ranks.length; i++) {
        if (days <= ranks[i].max) {
          const currentRank = ranks[i];
          const nextRank = ranks[i + 1] || ranks[i];
          return { current: currentRank, next: nextRank };
        }
      }
    }

    function updateUI(data) {
      const days = data.currentStreak || 0;
      const rankData = calculateRank(days);
      
      uName.textContent = data.name || "Warrior Profile";
      uAvatar.textContent = (data.name || "W").charAt(0).toUpperCase();
      uRank.textContent = `Rank: ${rankData.current.name} (Level ${rankData.current.level})`;
      
      streakVal.textContent = days;
      
      if (rankData.current.name === "Ascetic") {
        msName.textContent = "Max Rank";
        msDays.textContent = "";
      } else {
        msName.textContent = rankData.next.name;
        msDays.textContent = `(${rankData.current.max + 1} Days)`;
      }
    }

    // Auth Listener
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      
      currentUid = user.uid;
      const docRef = doc(db, "users", currentUid);
      const snap = await getDoc(docRef);

      if (snap.exists()) {
        currentUserDoc = snap.data();
        updateUI(currentUserDoc);
        loadingUI.style.opacity = '0';
        setTimeout(() => loadingUI.style.display = 'none', 300);
      } else {
        // User created auth but didn't finish onboarding (we will build onboarding.html next)
        window.location.href = "onboarding.html"; 
      }
    });

    // Logging Logic
    document.getElementById('btn-clean').addEventListener('click', async () => {
      if (!currentUserDoc) return;
      const newStreak = (currentUserDoc.currentStreak || 0) + 1;
      
      await updateDoc(doc(db, "users", currentUid), {
        currentStreak: newStreak,
        lastLogDate: new Date().toISOString()
      });
      
      currentUserDoc.currentStreak = newStreak;
      updateUI(currentUserDoc);
    });

    document.getElementById('btn-relapse').addEventListener('click', async () => {
      if (!currentUserDoc) return;
      if (!confirm("This will reset your streak to 0. Are you sure?")) return;
      
      await updateDoc(doc(db, "users", currentUid), {
        currentStreak: 0,
        lastLogDate: new Date().toISOString()
      });
      
      currentUserDoc.currentStreak = 0;
      updateUI(currentUserDoc);
    });

    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
  </script>
</body>
</html>
