<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - NoFap</title>
    <link rel="icon" type="image/png" href="resources/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050510;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            
            /* Dynamic Card Colors (Changed via JS) - Default is Grey */
            --card-bg-top: #374151; 
            --card-bg-bottom: #1f2937;
            --card-spotlight: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100dvh;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* Animated Background Orbs */
        .orb-container { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.3; animation: float 20s infinite alternate ease-in-out; }
        .orb-1 { width: 40vw; height: 40vw; background: #00f0ff; top: -10%; left: -10%; animation-delay: 0s; }
        .orb-2 { width: 35vw; height: 35vw; background: #8a2be2; bottom: -10%; right: -10%; animation-delay: -5s; }
        @keyframes float { to { transform: translate(10vw, 10vh) scale(1.1); } }

        /* Full Screen Loader */
        .glass-loader {
            position: fixed; inset: 0; background: rgba(5, 5, 16, 0.9);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .glass-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .loader-spinner-dual {
            width: 60px; height: 60px; border: 3px solid transparent; border-top-color: #00f0ff; border-bottom-color: #0066ff;
            border-radius: 50%; animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; margin-bottom: 25px;
            position: relative; box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }
        .loader-spinner-dual::before {
            content: ""; position: absolute; inset: 8px; border: 2px solid transparent;
            border-left-color: rgba(255,255,255,0.6); border-right-color: rgba(255,255,255,0.6); border-radius: 50%; animation: spin-reverse 1.5s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes spin-reverse { to { transform: rotate(-360deg); } }

        /* Navigation */
        .app-nav {
            position: fixed; z-index: 1000; display: flex; align-items: center; justify-content: space-between;
            background: rgba(5, 5, 16, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border); transition: all 0.3s ease;
        }
        .nav-brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.2rem; color: white; text-decoration: none; }
        .nav-brand img { width: 32px; height: 32px; border-radius: 8px; }
        .nav-links { display: flex; gap: 20px; align-items: center; justify-content: space-around; width: 100%; }
        .nav-item {
            color: var(--text-muted); text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 5px;
            font-size: 0.85rem; font-weight: 600; transition: color 0.3s, transform 0.2s;
        }
        .nav-item:hover { transform: translateY(-2px); color: white; }
        .nav-item.active { color: white; }
        .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav-item.active svg { stroke: #00f0ff; filter: drop-shadow(0 0 8px rgba(0,240,255,0.4)); }

        @media (min-width: 769px) {
            .app-nav { top: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 1200px; border-radius: 20px; padding: 15px 30px; }
            .nav-item span { display: inline-block; }
            .nav-item { flex-direction: row; gap: 10px; font-size: 1rem; }
            .nav-links { width: auto; }
            .mobile-only { display: none !important; }
        }
        @media (max-width: 768px) {
            .app-nav {
                bottom: 25px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; border-radius: 50px; padding: 15px 25px;
                justify-content: space-between; top: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            }
            .nav-brand, .nav-item span { display: none; }
            .desktop-only { display: none !important; }
        }

        /* Layout */
        .container { max-width: 600px; margin: 0 auto; padding: 100px 20px 40px 20px; display: flex; flex-direction: column; gap: 30px; }
        @media (max-width: 768px) { .container { padding-top: 40px; } }

        /* HERO STREAK CARD */
        .streak-card-hero {
            background: linear-gradient(180deg, var(--card-bg-top) 0%, var(--card-bg-bottom) 100%);
            border-radius: 32px;
            padding: 40px 20px 25px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: background 0.8s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Spotlight Flare */
        .streak-card-hero::before {
            content: ''; position: absolute; top: -50px; left: 50%; transform: translateX(-50%);
            width: 200px; height: 100px; background: var(--card-spotlight);
            filter: blur(45px); border-radius: 50%; pointer-events: none;
            transition: background 0.8s ease;
        }

        /* Custom User SVG Engine */
        .streak-media-wrapper {
            width: 110px; height: 110px; margin-bottom: 25px;
            display: flex; justify-content: center; align-items: center;
        }
        .streak-media-wrapper img {
            width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
            transition: all 0.5s ease;
        }
        
        /* Pulse Animation for Logged Clean Days */
        .icon-alive { animation: pulse-glow 2.5s infinite alternate ease-in-out; }
        @keyframes pulse-glow {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)) brightness(1); }
            100% { transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(255,255,255,0.7)) brightness(1.2); }
        }

        .streak-count-text { font-size: 2.8rem; font-weight: 800; line-height: 1; margin-bottom: 5px; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .streak-label { font-size: 0.9rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.9); margin-bottom: 8px;}
        .highest-streak-line { font-size: 0.85rem; font-weight: 700; color: rgba(255,255,255,0.6); margin-bottom: 15px; }
        .streak-subtext { font-size: 0.95rem; font-weight: 600; color: rgba(255,255,255,0.8); margin-bottom: 35px; }

        /* Weekly Calendar Pill */
        .weekly-calendar {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 20px;
            padding: 15px 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .day-node { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        
        .day-icon-wrapper {
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05); 
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s ease;
        }
        
        .day-icon-img {
            width: 18px; height: 18px; object-fit: contain;
        }

        .day-node.today .day-icon-wrapper {
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        .day-label { font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.5); text-transform: uppercase; }
        .day-node.today .day-label { color: #fff; }

        /* Glass Panel (Reusable) */
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: var(--glass-shadow);
        }

        /* Check-in Form Zone */
        .checkin-zone { position: relative; padding: 30px; overflow: hidden; min-height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: opacity 0.5s, height 0.5s; }
        
        .checkin-step {
            position: absolute; width: 100%; padding: 0 30px;
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            opacity: 0; transform: translateX(50px); pointer-events: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .checkin-step.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
        .checkin-step.exit { opacity: 0; transform: translateX(-50px); pointer-events: none; }

        .checkin-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 5px; }

        .btn-group { display: flex; gap: 15px; width: 100%; max-width: 300px; justify-content: center; }
        .btn-log {
            flex: 1; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 1rem; border: none; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s; color: white;
        }
        .btn-log:active { transform: scale(0.95); }
        .btn-no { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.5); color: #10b981; }
        .btn-yes { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #ef4444; }

        /* Custom Range Slider */
        .slider-container { width: 100%; max-width: 300px; margin-top: 10px; }
        .slider-value { font-size: 1.5rem; font-weight: 800; color: #00f0ff; margin-bottom: 15px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin-bottom: 20px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%;
            background: #00f0ff; box-shadow: 0 0 15px #00f0ff; margin-top: -8px; cursor: pointer; transition: transform 0.1s;
        }
        .btn-submit { background: #00f0ff; color: #000; padding: 12px 30px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; width: 100%; transition: transform 0.2s; }
        .btn-submit:active { transform: scale(0.95); }

        /* Squad Zone */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; margin-top: 20px; }
        .section-title { font-size: 1.2rem; font-weight: 800; letter-spacing: 0.5px; }
        
        .squad-empty-card {
            padding: 30px; text-align: center; border: 1px dashed var(--glass-border);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
        }
        .btn-outline {
            background: transparent; border: 1px solid var(--text-main); color: var(--text-main);
            padding: 10px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; text-decoration: none; transition: background 0.3s, color 0.3s;
        }
        .btn-outline:hover { background: var(--text-main); color: #000; }

    </style>
</head>
<body>

    <!-- Full Screen Loader -->
    <div id="global-loader" class="glass-loader">
        <div class="loader-spinner-dual"></div>
        <h2 style="font-size: 0.9rem; font-weight: 700; letter-spacing: 4px; color: var(--text-muted); text-transform: uppercase;">Loading...</h2>
    </div>

    <!-- Animated Orbs -->
    <div class="orb-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- Navigation -->
    <nav class="app-nav">
        <div class="nav-brand desktop-only">
            <img src="resources/images/logo.png" alt="Logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0MCIgZmlsbD0iIzAwZjBmZiIvPjwvc3ZnPg=='">
            <span>NoFap</span>
        </div>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Home</span>
            </a>
            <a href="chats.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                <span>Chats</span>
            </a>
            <a href="games.html" class="nav-item">

            </a>
            <a href="profile.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Profile</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        
        <!-- The True Hero Card (Dynamic Background) -->
        <div class="streak-card-hero" id="streak-hero">
            
            <!-- Custom SVG Streak Icon -->
            <div class="streak-media-wrapper">
                <img id="ui-streak-image" src="resources/images/streak-bolt-zero.svg" alt="Streak Asset">
            </div>

            <!-- Text Content -->
            <div class="streak-count-text" id="ui-current-streak">0</div>
            <div class="streak-label">Days Clean</div>
            <div class="highest-streak-line">Highest Streak: <span id="ui-highest-streak">0</span></div>
            <div class="streak-subtext" id="ui-subtext">Connecting...</div>

            <!-- 7-Day Calendar Pill -->
            <div class="weekly-calendar" id="calendar-ui">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Daily Check-In Zone (Will disappear upon completion) -->
        <div class="glass-panel checkin-zone" id="checkin-container" style="display: none;">
            
            <!-- Step 1: Masturbation -->
            <div class="checkin-step active" id="step-1">
                <h3 class="checkin-title">Did you masturbate today?</h3>
                <div class="btn-group">
                    <button class="btn-log btn-no" onclick="handleStep1('no')">No</button>
                    <button class="btn-log btn-yes" onclick="handleStep1('yes')">Yes</button>
                </div>
            </div>

            <!-- Step 2: Porn -->
            <div class="checkin-step" id="step-2">
                <h3 class="checkin-title">Did you watch porn today?</h3>
                <div class="btn-group">
                    <button class="btn-log btn-no" onclick="handleStep2('no')">No</button>
                    <button class="btn-log btn-yes" onclick="handleStep2('yes')">Yes</button>
                </div>
            </div>

            <!-- Step 3: Slider (Only if porn Yes) -->
            <div class="checkin-step" id="step-3">
                <h3 class="checkin-title">How many hours?</h3>
                <div class="slider-container">
                    <div class="slider-value" id="slider-display">0.5 hrs</div>
                    <input type="range" id="porn-slider" min="0.5" max="5.5" step="0.5" value="0.5" oninput="updateSliderUI(this.value)">
                    <button class="btn-submit" onclick="submitFailureLog()">Submit Log</button>
                </div>
            </div>
        </div>

        <!-- Squad Zone -->
        <div>
            <div class="section-header">
                <h2 class="section-title">Your Squad</h2>
            </div>
            <div class="glass-panel squad-empty-card">
                <p style="color: var(--text-muted); font-size: 0.95rem;">You walk alone. Join a squad for accountability.</p>
                <a href="chats.html" class="btn-outline">Join a Group</a>
            </div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDT_eCcjjwc9k9dBjFUIOLcW3kJuWWzjq8",
            authDomain: "no-fap-addiction-remover.firebaseapp.com",
            projectId: "no-fap-addiction-remover",
            storageBucket: "no-fap-addiction-remover.firebasestorage.app",
            messagingSenderId: "534202646830",
            appId: "1:534202646830:web:04c0098a3ed15ed1d4fabf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserUid = null;
        let userData = null;
        let failedToday = false;
        
        // Exact milestone array logic
        const MILESTONES = [7, 15, 30, 50, 100, 200, 300, 600];

        // Ensure safe local date string generation (Midnight strict - Local Device Time)
        function getLocalTimeDateString(dateObj = new Date()) {
            const offset = dateObj.getTimezoneOffset() * 60000; 
            return (new Date(dateObj - offset)).toISOString().split('T')[0];
        }

        // AUTH LISTENER
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid;
                try {
                    const userDoc = await getDoc(doc(db, "users", currentUserUid));
                    if (userDoc.exists() && userDoc.data().nickname) {
                        userData = userDoc.data();
                        renderDashboard();
                        setTimeout(() => document.getElementById('global-loader').classList.add('hidden'), 400);
                    } else {
                        window.location.replace("onboarding.html"); 
                    }
                } catch (e) {
                    console.error("Error loading profile", e);
                }
            } else {
                window.location.replace("index.html"); 
            }
        });

        // 12 AM Background Listener
        let lastRenderedDateStr = getLocalTimeDateString();
        setInterval(() => {
            if (userData) {
                const currentToday = getLocalTimeDateString();
                if (currentToday !== lastRenderedDateStr) {
                    lastRenderedDateStr = currentToday;
                    renderDashboard(); // Force reset form and colors at midnight
                }
            }
        }, 60000);

        // CORE SVG LOGIC (Historical Math Engine)
        function getIconForDay(dateObj, isToday) {
            const dateStr = getLocalTimeDateString(dateObj);
            const todayStr = getLocalTimeDateString(new Date());
            const { currentStreak, lastLogDate, lastLogStatus } = userData;
            const loggedToday = (lastLogDate === todayStr);
            
            // 1. TODAY logic
            if (isToday) {
                // Not logged yet today -> Blue (Active) or Grey (0)
                if (!loggedToday) {
                    return currentStreak > 0 ? 'resources/images/streak-bolt-active.svg' : 'resources/images/streak-bolt-zero.svg';
                }
                
                // Logged Fail today -> Broken Red
                if (lastLogStatus === 'failed') return 'resources/images/streak-bolt-broken.svg';
                
                // Logged Clean today -> Check Milestones
                if (MILESTONES.includes(currentStreak)) return 'resources/images/streak-crown-gold.svg';
                return 'resources/images/streak-bolt-milestone-green.svg';
            }

            // 2. PAST DAYS logic (Calendar)
            const diffTime = new Date(todayStr).setHours(0,0,0,0) - new Date(dateStr).setHours(0,0,0,0);
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

            let isCoveredByStreak = false;
            let streakOnThatDay = 0;

            if (currentStreak > 0) {
                if (loggedToday && lastLogStatus === 'clean') {
                    if (diffDays < currentStreak) {
                        isCoveredByStreak = true;
                        streakOnThatDay = currentStreak - diffDays;
                    }
                } else {
                    if (diffDays <= currentStreak) {
                        isCoveredByStreak = true;
                        streakOnThatDay = currentStreak - diffDays + 1;
                    }
                }
            }

            if (isCoveredByStreak) {
                 if (MILESTONES.includes(streakOnThatDay)) return 'resources/images/streak-crown-gold.svg';
                 return 'resources/images/streak-bolt-milestone-green.svg';
            }

            if (dateStr === lastLogDate && lastLogStatus === 'failed') {
                return 'resources/images/streak-bolt-broken.svg';
            }
            
            // Anything else (Unlogged past day or broken long ago)
            return 'resources/images/streak-bolt-zero.svg';
        }

        // Render Dashboard & Dynamic Solid Colors
        function renderDashboard() {
            const todayStr = getLocalTimeDateString();
            const streak = userData.currentStreak || 0;
            const highest = userData.highestStreak || 0;
            const name = userData.nickname || "Warrior";
            const loggedToday = (userData.lastLogDate === todayStr);
            
            document.getElementById('ui-current-streak').textContent = streak;
            document.getElementById('ui-highest-streak').textContent = highest;

            const root = document.documentElement;
            const imgEl = document.getElementById('ui-streak-image');
            imgEl.className = ''; // Reset pulse class

            // Determine Main Icon
            const mainIconSrc = getIconForDay(new Date(), true);
            imgEl.src = mainIconSrc;
            
            // Add pulse animation ONLY if active and clean
            if (loggedToday && userData.lastLogStatus === 'clean') {
                imgEl.classList.add('icon-alive');
            }

            // DYNAMIC COLOR ENGINE
            if (!loggedToday) {
                // State 1: Grey (Unlogged Today)
                root.style.setProperty('--card-bg-top', '#374151');
                root.style.setProperty('--card-bg-bottom', '#1f2937');
                root.style.setProperty('--card-spotlight', 'rgba(255,255,255,0.05)');
                document.getElementById('ui-subtext').textContent = `Time to log your day, ${name}.`;
            } else if (userData.lastLogStatus === 'failed') {
                // State 2: Grey (Relapsed Today)
                root.style.setProperty('--card-bg-top', '#374151');
                root.style.setProperty('--card-bg-bottom', '#1f2937');
                root.style.setProperty('--card-spotlight', 'rgba(239, 68, 68, 0.15)'); // Slight red tint spotlight
                document.getElementById('ui-subtext').textContent = `Start again, ${name}. Don't surrender.`;
            } else if (MILESTONES.includes(streak)) {
                // State 3: Orange/Gold (Milestone Reached ONLY)
                root.style.setProperty('--card-bg-top', '#f97316');
                root.style.setProperty('--card-bg-bottom', '#9a3412');
                root.style.setProperty('--card-spotlight', 'rgba(255, 255, 255, 0.4)');
                document.getElementById('ui-subtext').textContent = `Milestone Reached, ${name}!`;
            } else {
                // State 4: Glowing Green (All other Active Clean Days)
                root.style.setProperty('--card-bg-top', '#10b981');
                root.style.setProperty('--card-bg-bottom', '#064e3b');
                root.style.setProperty('--card-spotlight', 'rgba(255, 255, 255, 0.3)');
                document.getElementById('ui-subtext').textContent = `You're on fire, ${name}!`;
            }

            renderCalendar();

            // Time Lock Form Logic
            const checkinContainer = document.getElementById('checkin-container');
            if (loggedToday) {
                checkinContainer.style.display = 'none';
            } else {
                checkinContainer.style.display = 'flex';
                showStep('step-1');
            }
        }

        // Generate 7-Day Calendar
        function renderCalendar() {
            const calendarEl = document.getElementById('calendar-ui');
            let html = ''; 
            const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dayName = daysOfWeek[d.getDay()];
                const isToday = (i === 0);
                
                const iconSrc = getIconForDay(d, isToday);
                
                html += `
                    <div class="day-node ${isToday ? 'today' : ''}">
                        <div class="day-icon-wrapper">
                            <img src="${iconSrc}" class="day-icon-img" alt="status">
                        </div>
                        <div class="day-label">${dayName}</div>
                    </div>
                `;
            }
            calendarEl.innerHTML = html;
        }

        // Form Flow
        function showStep(stepId) {
            document.querySelectorAll('.checkin-step').forEach(el => {
                if(el.id === stepId) el.className = 'checkin-step active';
                else if(el.classList.contains('active')) el.className = 'checkin-step exit';
                else el.className = 'checkin-step';
            });
        }

        window.handleStep1 = (answer) => {
            if(answer === 'yes') failedToday = true;
            showStep('step-2');
        };

        window.handleStep2 = async (answer) => {
            if(answer === 'yes') {
                failedToday = true;
                showStep('step-3'); // Ask for porn hours
            } else {
                if (failedToday) {
                    await processLog(false, 0); // Fapped but no porn
                } else {
                    await processLog(true, 0);  // Fully Clean
                }
            }
        };

        window.updateSliderUI = (val) => {
            document.getElementById('slider-display').textContent = val >= 5.5 ? "5+ hrs" : `${val} hrs`;
        };

        window.submitFailureLog = async () => {
            const hours = document.getElementById('porn-slider').value;
            await processLog(false, hours);
        };

        // Write to Firebase Server
        async function processLog(isClean, pornHours) {
            document.getElementById('global-loader').classList.remove('hidden');
            const todayStr = getLocalTimeDateString();
            
            let newStreak = isClean ? (userData.currentStreak || 0) + 1 : 0;
            let newHighest = Math.max(newStreak, userData.highestStreak || 0);

            const updateData = {
                currentStreak: newStreak,
                highestStreak: newHighest,
                lastLogDate: todayStr,
                lastLogStatus: isClean ? 'clean' : 'failed'
            };
            
            try {
                await updateDoc(doc(db, "users", currentUserUid), updateData);
                // Update local memory and re-render completely
                userData.currentStreak = newStreak;
                userData.highestStreak = newHighest;
                userData.lastLogDate = todayStr;
                userData.lastLogStatus = updateData.lastLogStatus;
                
                renderDashboard();
            } catch(e) {
                console.error("Failed to log", e);
                alert("Network error.");
            }
            setTimeout(() => document.getElementById('global-loader').classList.add('hidden'), 400);
        }
    </script>
</body>
</html>
