<!DOCTYPE html>
<html lang="en" data-theme="dark"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - NoFap</title>
<link rel="icon" type="image/png" href="resources/images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
:root{--card-bg-top:#374151;--card-bg-bottom:#1f2937;--card-spotlight:rgba(255,255,255,.1)}
body{padding-bottom:110px}
.app-nav{position:fixed;z-index:1000;display:flex;align-items:center;justify-content:space-between;background:var(--nav-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-border)}
.nav-brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.2rem;color:var(--text-main)}.nav-brand img{width:32px;height:32px;border-radius:8px}
.nav-links{display:flex;gap:20px;align-items:center;justify-content:space-around;width:100%}
.nav-item{color:var(--text-muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.85rem;font-weight:600;transition:color .3s,transform .2s;background:none;border:none;cursor:pointer}
.nav-item:hover{transform:translateY(-2px);color:var(--text-main)}.nav-item.active{color:var(--text-main)}
.nav-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active svg{stroke:var(--accent-cyan);filter:drop-shadow(0 0 8px rgba(0,240,255,.4))}
@media(min-width:769px){.app-nav{top:20px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:1200px;border-radius:20px;padding:15px 30px}.nav-item{flex-direction:row;gap:10px;font-size:1rem}.nav-links{width:auto}}
@media(max-width:768px){.app-nav{bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:90%;max-width:400px;border-radius:50px;padding:14px 25px;box-shadow:0 20px 40px rgba(0,0,0,.4)}.nav-brand,.nav-item span{display:none}}
.container{max-width:600px;margin:0 auto;padding:100px 20px 40px;display:flex;flex-direction:column;gap:30px}
@media(max-width:768px){.container{padding-top:30px}}
.streak-card-hero{background:linear-gradient(180deg,var(--card-bg-top),var(--card-bg-bottom));border-radius:32px;padding:40px 20px 25px;text-align:center;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4);transition:background .8s;display:flex;flex-direction:column;align-items:center;color:#fff}
.streak-card-hero::before{content:'';position:absolute;top:-50px;left:50%;transform:translateX(-50%);width:200px;height:100px;background:var(--card-spotlight);filter:blur(45px);border-radius:50%;pointer-events:none}
.streak-media-wrapper{width:110px;height:110px;margin-bottom:25px;display:flex;justify-content:center;align-items:center}
.streak-media-wrapper img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(0,0,0,.3))}
.icon-alive{animation:pulse-glow 2.5s infinite alternate ease-in-out}
@keyframes pulse-glow{0%{transform:scale(1);filter:drop-shadow(0 0 10px rgba(255,255,255,.2)) brightness(1)}100%{transform:scale(1.08);filter:drop-shadow(0 0 25px rgba(255,255,255,.7)) brightness(1.2)}}
#ui-current-streak{font-size:2.8rem;font-weight:800;line-height:1;margin-bottom:5px;text-shadow:0 4px 10px rgba(0,0,0,.3)}
.streak-label{font-size:.9rem;font-weight:800;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;opacity:.9}
.highest-streak-line{font-size:.85rem;font-weight:700;opacity:.6;margin-bottom:15px}.streak-subtext{font-size:.95rem;font-weight:600;opacity:.85;margin-bottom:35px}
.weekly-calendar{background:rgba(0,0,0,.25);border-radius:20px;padding:15px 12px;width:100%;display:flex;justify-content:space-between;align-items:center}
.day-node{display:flex;flex-direction:column;align-items:center;gap:8px}
.day-icon-wrapper{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.05);display:flex;justify-content:center;align-items:center}
.day-icon-wrapper img{width:18px;height:18px;object-fit:contain}
.day-node.today .day-icon-wrapper{background:rgba(255,255,255,.15);box-shadow:0 0 15px rgba(255,255,255,.1)}
.day-label{font-size:.7rem;font-weight:700;opacity:.5;text-transform:uppercase}.day-node.today .day-label{opacity:1}
.checkin-zone{position:relative;padding:30px;overflow:hidden;min-height:200px;display:flex;justify-content:center;align-items:center;text-align:center}
.checkin-step{position:absolute;width:100%;padding:0 24px;display:flex;flex-direction:column;align-items:center;gap:20px;opacity:0;transform:translateX(50px);pointer-events:none;transition:all .4s cubic-bezier(.175,.885,.32,1.275)}
.checkin-step.active{opacity:1;transform:none;pointer-events:auto}.checkin-step.exit{opacity:0;transform:translateX(-50px)}
.checkin-title{font-size:1.2rem;font-weight:700}
.btn-group{display:flex;gap:15px;width:100%;max-width:300px}
.btn-log{flex:1;padding:14px;border-radius:14px;font-weight:800;font-size:1rem;cursor:pointer;transition:transform .2s}.btn-log:active{transform:scale(.95)}
.btn-no{background:rgba(16,185,129,.2);border:1px solid rgba(16,185,129,.5);color:#10b981}.btn-yes{background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.5);color:#ef4444}
.slider-container{width:100%;max-width:300px}.slider-value{font-size:1.5rem;font-weight:800;color:var(--accent-cyan);margin-bottom:15px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin-bottom:20px}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:var(--glass-border);border-radius:4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:24px;width:24px;border-radius:50%;background:var(--accent-cyan);box-shadow:0 0 15px var(--accent-cyan);margin-top:-8px;cursor:pointer}
input[type=range]::-moz-range-track{height:8px;background:var(--glass-border);border-radius:4px}
input[type=range]::-moz-range-thumb{height:24px;width:24px;border:none;border-radius:50%;background:var(--accent-cyan);box-shadow:0 0 15px var(--accent-cyan)}
.btn-submit{background:var(--accent-cyan);color:#000;padding:12px 30px;border-radius:12px;font-weight:800;border:none;cursor:pointer;width:100%}
.section-title{font-size:1.2rem;font-weight:800;letter-spacing:.5px;margin-bottom:15px}
.squad-empty-card{padding:30px;text-align:center;border:1px dashed var(--glass-border);display:flex;flex-direction:column;align-items:center;gap:15px;color:var(--text-muted);font-size:.95rem}
.btn-outline{border:1px solid var(--text-main);color:var(--text-main);padding:10px 20px;border-radius:12px;font-weight:600;text-decoration:none;transition:background .3s,color .3s}
.btn-outline:hover{background:var(--text-main);color:var(--bg-color)}
</style></head><body>
<div id="global-loader" class="glass-loader"><div class="loader-spinner"></div><h2 class="loader-text">Loading...</h2></div>
<div class="orb-container"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<nav class="app-nav">
  <div class="nav-brand" style="display:none" id="brand"><img src="resources/images/logo.png" alt="Logo"><span>NoFap</span></div>
  <div class="nav-links">
    <a href="dashboard.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></a>
    <a href="chats.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>Chats</span></a>
    <a href="games.html" class="nav-item"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01M16 12h.01M8 12h.01M6 12h.01"/></svg><span>Games</span></a>
    <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></a>
    <button class="nav-item" id="themeToggle" aria-label="Toggle theme" style="font-size:1.3rem">🌙</button>
  </div>
</nav>
<main class="container">
  <div class="streak-card-hero">
    <div class="streak-media-wrapper"><img id="ui-streak-image" src="resources/images/streak-bolt-zero.svg" alt="Streak"></div>
    <div id="ui-current-streak">0</div><div class="streak-label">Days Clean</div>
    <div class="highest-streak-line">Highest Streak: <span id="ui-highest-streak">0</span></div>
    <div class="streak-subtext" id="ui-subtext">Connecting...</div>
    <div class="weekly-calendar" id="calendar-ui"></div>
  </div>
  <div class="glass-panel checkin-zone" id="checkin-container" style="display:none">
    <div class="checkin-step active" id="step-1"><h3 class="checkin-title">Did you masturbate today?</h3><div class="btn-group"><button class="btn-log btn-no" data-a="no">No</button><button class="btn-log btn-yes" data-a="yes">Yes</button></div></div>
    <div class="checkin-step" id="step-2"><h3 class="checkin-title">Did you watch porn today?</h3><div class="btn-group"><button class="btn-log btn-no" data-a="no">No</button><button class="btn-log btn-yes" data-a="yes">Yes</button></div></div>
    <div class="checkin-step" id="step-3"><h3 class="checkin-title">How many hours?</h3><div class="slider-container"><div class="slider-value" id="slider-display">0.5 hrs</div><input type="range" id="porn-slider" min="0.5" max="5.5" step="0.5" value="0.5" aria-label="Hours"><button class="btn-submit" id="submitLog">Submit Log</button></div></div>
  </div>
  <div><h2 class="section-title">Your Squad</h2><div class="glass-panel squad-empty-card"><p>You walk alone. Join a squad for accountability.</p><a href="chats.html" class="btn-outline">Join a Group</a></div></div>
</main>
<script type="module">
import { auth, db, $, hideLoader, dateStr, initTheme } from "./shared.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { doc, getDoc, setDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
initTheme($('themeToggle'));
if (matchMedia('(min-width:769px)').matches) $('brand').style.display = 'flex';
const IMG = n => `resources/images/${n}.svg`, Z = IMG('streak-bolt-zero'), A = IMG('streak-bolt-active'), B = IMG('streak-bolt-broken'), G = IMG('streak-bolt-milestone-green'), C = IMG('streak-crown-gold');
const MILESTONES = [7, 15, 30, 50, 100, 200, 300, 600];
let uid, u, failed = false, busy = false;
const T = () => dateStr(), Y = () => dateStr(new Date(Date.now() - 864e5));
// A streak is only alive if the last log was today or yesterday; otherwise it has silently broken.
const eff = () => (u.lastLogDate === T() || u.lastLogDate === Y()) ? (u.currentStreak || 0) : 0;
const diff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);

onAuthStateChanged(auth, async user => {
  if (!user) return location.replace("index.html");
  uid = user.uid;
  try {
    const s = await getDoc(doc(db, "users", uid));
    if (!s.exists() || !s.data().nickname) return location.replace("onboarding.html");
    u = s.data();
    // Backfill public profile for accounts created before it existed
    const p = await getDoc(doc(db, "publicProfiles", uid));
    if (!p.exists()) await setDoc(doc(db, "publicProfiles", uid), { nickname: u.nickname, currentStreak: u.currentStreak || 0, lastLogDate: u.lastLogDate || '' }).catch(console.error);
    render(); hideLoader();
  } catch (e) { console.error(e); alert("Couldn't load your data. Check your connection and refresh."); }
});
let shown = T();
setInterval(() => { if (u && T() !== shown) { shown = T(); failed = false; render(); } }, 6e4);
document.addEventListener('visibilitychange', () => { if (u && !document.hidden && T() !== shown) { shown = T(); failed = false; render(); } });

function icon(d, isToday) {
  const s = eff(), ds = dateStr(d), logged = u.lastLogDate === T(), fail = logged && u.lastLogStatus === 'failed';
  if (isToday) { if (!logged) return s > 0 ? A : Z; if (fail) return B; return MILESTONES.includes(s) ? C : G; }
  if (s > 0) { const k = diff(ds, logged ? T() : Y()); if (k >= 0 && k < s) return MILESTONES.includes(s - k) ? C : G; }
  return (fail && ds === u.lastLogDate) ? B : Z;
}
function setColors(top, bot, spot) { const r = document.documentElement.style; r.setProperty('--card-bg-top', top); r.setProperty('--card-bg-bottom', bot); r.setProperty('--card-spotlight', spot); }
function render() {
  const s = eff(), name = u.nickname || "Warrior", logged = u.lastLogDate === T(), img = $('ui-streak-image');
  $('ui-current-streak').textContent = s; $('ui-highest-streak').textContent = u.highestStreak || 0;
  img.src = icon(new Date(), true); img.className = (logged && u.lastLogStatus === 'clean') ? 'icon-alive' : '';
  const sub = $('ui-subtext');
  if (!logged) { setColors('#374151', '#1f2937', 'rgba(255,255,255,.05)'); sub.textContent = `Time to log your day, ${name}.`; }
  else if (u.lastLogStatus === 'failed') { setColors('#374151', '#1f2937', 'rgba(239,68,68,.15)'); sub.textContent = `Start again, ${name}. Don't surrender.`; }
  else if (MILESTONES.includes(s)) { setColors('#f97316', '#9a3412', 'rgba(255,255,255,.4)'); sub.textContent = `Milestone Reached, ${name}!`; }
  else { setColors('#10b981', '#064e3b', 'rgba(255,255,255,.3)'); sub.textContent = `You're on fire, ${name}!`; }
  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  $('calendar-ui').innerHTML = [6, 5, 4, 3, 2, 1, 0].map(i => { const d = new Date(); d.setDate(d.getDate() - i);
    return `<div class="day-node ${i === 0 ? 'today' : ''}"><div class="day-icon-wrapper"><img src="${icon(d, i === 0)}" alt=""></div><div class="day-label">${days[d.getDay()]}</div></div>`; }).join('');
  const box = $('checkin-container'); box.style.display = logged ? 'none' : 'flex';
  if (!logged) step('step-1');
}
function step(id) { document.querySelectorAll('.checkin-step').forEach(el => el.className = el.id === id ? 'checkin-step active' : el.classList.contains('active') ? 'checkin-step exit' : 'checkin-step'); }
$('step-1').addEventListener('click', e => { const a = e.target.dataset.a; if (!a) return; if (a === 'yes') failed = true; step('step-2'); });
$('step-2').addEventListener('click', e => { const a = e.target.dataset.a; if (!a) return;
  if (a === 'yes') { failed = true; step('step-3'); } else save(!failed, 0, failed); });
$('porn-slider').addEventListener('input', e => $('slider-display').textContent = e.target.value >= 5.5 ? "5+ hrs" : `${e.target.value} hrs`);
$('submitLog').onclick = () => save(false, parseFloat($('porn-slider').value), failed);

async function save(clean, hours, masturbated) {
  if (busy) return; busy = true; $('global-loader').classList.remove('hidden');
  const today = T(), base = eff();
  const cur = clean ? base + 1 : 0, high = Math.max(cur, u.highestStreak || 0);
  const fields = { currentStreak: cur, highestStreak: high, lastLogDate: today, lastLogStatus: clean ? 'clean' : 'failed' };
  try {
    const b = writeBatch(db);
    b.update(doc(db, "users", uid), { ...fields, lastLogAt: serverTimestamp() });
    b.set(doc(db, "users", uid, "logs", today), { date: today, masturbated: !!masturbated, pornHours: hours });
    b.set(doc(db, "publicProfiles", uid), { nickname: u.nickname, currentStreak: cur, lastLogDate: today });
    await b.commit();
    Object.assign(u, fields); failed = false; render();
  } catch (e) { console.error(e); alert("Couldn't save your log (already logged today, or network error). Refresh and try again."); }
  busy = false; hideLoader();
}
</script></body></html>
