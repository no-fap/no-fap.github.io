<!DOCTYPE html>
<html lang="en" data-theme="dark"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games - NoFap</title>
<link rel="icon" type="image/png" href="resources/images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
body{padding-bottom:110px}
.app-nav{position:fixed;z-index:1000;display:flex;align-items:center;justify-content:space-between;background:var(--nav-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-border)}
.nav-brand{display:none;align-items:center;gap:12px;font-weight:800;font-size:1.2rem}.nav-brand img{width:32px;height:32px;border-radius:8px}
.nav-links{display:flex;gap:20px;align-items:center;justify-content:space-around;width:100%}
.nav-item{color:var(--text-muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.85rem;font-weight:600;transition:color .3s,transform .2s;background:none;border:none;cursor:pointer}
.nav-item:hover,.nav-item.active{color:var(--text-main)}.nav-item:hover{transform:translateY(-2px)}
.nav-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active svg{stroke:var(--accent-cyan);filter:drop-shadow(0 0 8px rgba(0,240,255,.4))}
@media(min-width:769px){.app-nav{top:20px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:1200px;border-radius:20px;padding:15px 30px}.nav-brand{display:flex}.nav-item{flex-direction:row;gap:10px;font-size:1rem}.nav-links{width:auto}}
@media(max-width:768px){.app-nav{bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:90%;max-width:400px;border-radius:50px;padding:14px 25px;box-shadow:0 20px 40px rgba(0,0,0,.4)}.nav-item span{display:none}}
body.playing .app-nav{display:none}
main{max-width:1100px;margin:0 auto;padding:100px 0 40px}@media(max-width:768px){main{padding-top:30px}}
h1{font-size:1.6rem;font-weight:800;padding:0 20px 18px}
/* locked state */
#locked{display:none;margin:8vh auto 0;width:min(90vw,420px);padding:40px 28px;text-align:center}
#locked svg{width:56px;height:56px;stroke:var(--accent-cyan);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-bottom:16px}
#locked h2{font-size:1.3rem;margin-bottom:8px}#locked p{color:var(--text-muted);font-size:.95rem;margin-bottom:22px}
.bar{height:10px;border-radius:6px;background:var(--glass-border);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent-cyan),var(--accent-blue));transition:width .6s}
.bar-label{margin-top:10px;font-size:.85rem;font-weight:700;color:var(--text-muted)}
/* library */
#lib{display:none}
#list{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 7.5vw 14px;scrollbar-width:none}#list::-webkit-scrollbar{display:none}
.gcard{flex:0 0 85vw;max-width:420px;scroll-snap-align:center;border-radius:28px;overflow:hidden;position:relative;cursor:pointer;border:1px solid var(--glass-border);background:var(--glass-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);transition:transform .3s,border-color .3s}
.gcard.sel{border-color:rgba(0,240,255,.45)}
.art{height:200px;display:flex;align-items:center;justify-content:center;font-size:3.2rem;font-weight:800;color:#fff;text-shadow:0 6px 20px rgba(0,0,0,.35)}
.gname{padding:14px 18px;font-weight:800;font-size:1.1rem}
.gcard.locked .art{filter:grayscale(1) blur(3px)}.gcard.locked .gname{color:var(--text-muted)}
.lockov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(5,5,16,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-weight:800;font-size:.9rem}
.gcard.locked .lockov{display:flex}
.lockov svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#detail{margin:6px 7.5vw 0;padding:22px;border-radius:0 0 28px 28px;border-top:none}
#detail h2{font-size:1.4rem;margin-bottom:6px}#detail p{color:var(--text-muted);line-height:1.5;font-size:.95rem;margin-bottom:12px}
.best{font-weight:700;font-size:.9rem;margin-bottom:16px}.best b{color:var(--accent-cyan)}
#play{width:100%;font-size:1.05rem;padding:15px}#play:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
@media(min-width:900px){
 #lib{grid-template-columns:340px 1fr;gap:24px;padding:0 20px;align-items:start}#lib.on{display:grid}
 #list{flex-direction:column;overflow:visible;padding:0;scroll-snap-type:none}
 .gcard{flex:none;max-width:none;display:flex;align-items:center;border-radius:20px}.gcard:hover{transform:translateX(4px)}
 .art{height:72px;width:72px;flex:none;font-size:1.1rem;border-radius:20px;margin:8px}.gname{padding:0 8px}
 .lockov{flex-direction:row;font-size:.8rem;justify-content:flex-end;padding-right:16px}.lockov svg{width:22px;height:22px}
 #detail{margin:0;border-radius:28px;border-top:1px solid var(--glass-border);padding:40px;min-height:340px}#detail h2{font-size:2rem}
 #play{width:auto;padding:15px 50px}}
/* play window */
#pov{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;background:rgba(5,5,16,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#pov.open{display:flex}
#pwin{display:flex;flex-direction:column;width:min(92vw,520px);height:min(92dvh,860px);border-radius:28px;overflow:hidden;border:1px solid var(--glass-border);background:var(--bg-color)}
@media(min-width:900px){#pwin{width:min(92vw,960px);height:min(90dvh,820px)}}
#pov.fs #pwin{width:100vw;height:100dvh;border-radius:0;border:none}
.pstrip{display:flex;justify-content:flex-end;gap:8px;padding:8px 10px;background:var(--glass-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--glass-border)}
.pbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--glass-border);background:var(--glass-bg);color:var(--text-main);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.pbtn.x{color:#ef4444;border-color:rgba(239,68,68,.4)}
#pf{flex:1;width:100%;border:none;background:transparent}
</style></head><body>
<div id="global-loader" class="glass-loader"><div class="loader-spinner"></div><h2 class="loader-text">Loading...</h2></div>
<div class="orb-container"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<nav class="app-nav">
  <div class="nav-brand"><img src="resources/images/logo.png" alt="Logo"><span>NoFap</span></div>
  <div class="nav-links">
    <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></a>
    <a href="chats.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>Chats</span></a>
    <a href="games.html" class="nav-item active"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01M16 12h.01M8 12h.01M6 12h.01"/></svg><span>Games</span></a>
    <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></a>
    <button class="nav-item" id="themeToggle" aria-label="Toggle theme" style="font-size:1.3rem">🌙</button>
  </div>
</nav>
<main>
  <h1>Games</h1>
  <div id="locked" class="glass-panel">
    <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <h2>Games are locked</h2><p>Reach a 7-day streak to unlock the games section.</p>
    <div class="bar"><i id="lbar" style="width:0"></i></div><div class="bar-label" id="llabel"></div>
  </div>
  <div id="lib"><div id="list"></div><div id="detail" class="glass-panel"></div></div>
</main>
<div id="pov"><div id="pwin"><div class="pstrip">
  <button class="pbtn" id="fs" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  <button class="pbtn x" id="px" aria-label="Close game"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
</div><iframe id="pf" title="Game" allow="fullscreen"></iframe></div></div>
<script type="module">
import { auth, db, $, hideLoader, dateStr, initTheme } from "./shared.js";
import { GAMES } from "./config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
initTheme($('themeToggle'));
const LOCK = '<svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
let uid, streak = 0, sel = 0, best = {}, ignorePop = false;
onAuthStateChanged(auth, async user => {
  if (!user) return location.replace("index.html");
  uid = user.uid;
  try {
    const u = (await getDoc(doc(db, "users", uid))).data() || {};
    const t = dateStr(), y = dateStr(new Date(Date.now() - 864e5));
    streak = (u.lastLogDate === t || u.lastLogDate === y) ? (u.currentStreak || 0) : 0;
    render(); hideLoader();
  } catch (e) { console.error(e); alert("Couldn't load games (" + (e.code || e.message) + ")."); hideLoader(); }
});
function render() {
  const min = Math.min(...GAMES.map(g => g.days));
  if (streak < min) {
    $('locked').style.display = 'block'; $('lbar').style.width = Math.min(100, streak / min * 100) + '%';
    $('llabel').textContent = `${streak} of ${min} days`; return;
  }
  $('lib').classList.add('on'); $('lib').style.display = 'block';
  $('list').innerHTML = GAMES.map((g, i) => `<div class="gcard ${streak < g.days ? 'locked' : ''}" data-i="${i}">
    <div class="art" style="background:linear-gradient(135deg,${g.c[0]},${g.c[1]})">${g.glyph}</div><div class="gname">${g.name}</div>
    <div class="lockov">${LOCK}<span>Day ${g.days}</span></div></div>`).join('');
  $('list').querySelectorAll('.gcard').forEach(c => c.onclick = () => { select(+c.dataset.i); if (innerWidth < 900) c.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); });
  let tm; $('list').addEventListener('scroll', () => { if (innerWidth >= 900) return; clearTimeout(tm); tm = setTimeout(() => {
    const L = $('list'), mid = L.scrollLeft + L.clientWidth / 2; let bi = 0, bd = 1e9;
    L.querySelectorAll('.gcard').forEach((c, i) => { const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid); if (d < bd) { bd = d; bi = i; } }); if (bi !== sel) select(bi); }, 80); });
  select(0);
}
async function select(i) {
  sel = i; const g = GAMES[i], locked = streak < g.days;
  document.querySelectorAll('.gcard').forEach((c, k) => c.classList.toggle('sel', k === i));
  const d = $('detail'); const state = locked ? `Unlocks at ${g.days} days` : g.url ? '' : 'Coming soon';
  d.innerHTML = `<h2></h2><p></p><div class="best" id="best"></div><div class="bar" style="display:${locked ? 'block' : 'none'};margin-bottom:12px"><i style="width:${Math.min(100, streak / g.days * 100)}%"></i></div>
    <button class="btn-primary" id="play" ${(locked || !g.url) ? 'disabled' : ''}>${locked ? `Locked · ${g.days - streak} days to go` : g.url ? 'Play' : 'Coming soon'}</button>`;
  d.querySelector('h2').textContent = g.name; d.querySelector('p').textContent = g.desc;
  $('play').onclick = () => openGame(g);
  if (!locked && g.url) {
    if (best[g.id] === undefined) { try { const s = await getDoc(doc(db, "users", uid, "games", g.id)); best[g.id] = s.exists() ? (s.data().highScore || 0) : 0; } catch { best[g.id] = null; } }
    if (sel === i && $('best')) $('best').innerHTML = best[g.id] ? `Your best: <b>${best[g.id].toLocaleString()}</b>` : '';
  }
}
function openGame(g) {
  $('pf').src = g.url; $('pov').classList.add('open'); document.body.classList.add('playing');
  history.pushState({ g: 1 }, '');
}
function closeGame() {
  $('pov').classList.remove('open', 'fs'); document.body.classList.remove('playing'); $('pf').src = 'about:blank';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  delete best[GAMES[sel].id]; select(sel);
  if (history.state?.g) { ignorePop = true; history.back(); }
}
const askClose = () => { try { $('pf').contentWindow.postMessage({ type: 'REQUEST_CLOSE' }, location.origin); } catch { closeGame(); } };
$('px').onclick = askClose;
$('fs').onclick = () => {
  const o = $('pov'), on = !o.classList.contains('fs'); o.classList.toggle('fs', on);
  if (on) o.requestFullscreen?.().catch(() => {}); else if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
};
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) $('pov').classList.remove('fs'); });
window.addEventListener('message', e => { if (e.origin === location.origin && e.data?.type === 'CLOSE_GAME') closeGame(); });
window.addEventListener('popstate', () => { if (ignorePop) { ignorePop = false; return; } if ($('pov').classList.contains('open')) { history.pushState({ g: 1 }, ''); askClose(); } });
</script></body></html>
